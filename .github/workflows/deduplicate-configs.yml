name: Process WireGuard Configs

on:
  push:
    paths:
      - 'ALL.txt'
  workflow_dispatch:

jobs:
  process-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Deduplicate, sort, generate AmneziaWG Clash configs and WireGuard conf files
        shell: python
        run: |
          import re, os, yaml, zipfile, tempfile, base64, random
          from urllib.parse import unquote, quote

          INPUT_FILE = "ALL.txt"
          OUTPUT_FILE = "ALL.yaml"
          ZIP_FILE = "wireguard_configs.zip"

          BASE_CONFIG = {
              "name": "Standard",
              "mixed-port": 7890,
              "socks-port": 7891,
              "port": 7892,
              "allow-lan": True,
              "bind-address": "*",
              "mode": "global",
              "log-level": "info",
              "ipv6": True,
              "external-controller": "127.0.0.1:9090",
              "external-ui": "ui",
              "secret": "",
              "unified-delay": True,
              "tcp-concurrent": True,
              "global-client-fingerprint": "chrome",
              "find-process-mode": "strict",
              "keep-alive-interval": 15,
              "profile": {
                  "store-selected": True,
                  "store-fake-ip": False
              },
              "dns": {
                  "enable": True,
                  "ipv6": True,
                  "listen": "0.0.0.0:5353",
                  "enhanced-mode": "fake-ip",
                  "fake-ip-range": "198.18.0.1/16",
                  "fake-ip-filter": [
                      "*.local", "*.lan", "*.localhost",
                      "+.stun.*.*", "+.stun.*.*.*",
                      "time.*", "time.*.com",
                      "connectivitycheck.gstatic.com",
                      "detectportal.firefox.com",
                      "captive.apple.com",
                      "www.msftncsi.com",
                      "cp.cloudflare.com"
                  ],
                  "default-nameserver": [
                      "1.1.1.1",
                      "1.0.0.1",
                      "8.8.8.8",
                      "8.8.4.4",
                      "9.9.9.9",
                      "149.112.112.112",
                      "208.67.222.222",
                      "208.67.220.220",
                      "8.26.56.26",
                      "8.20.247.20"
                  ],
                  "nameserver": [
                      "1.1.1.1",
                      "1.0.0.1",
                      "8.8.8.8",
                      "8.8.4.4",
                      "9.9.9.9",
                      "149.112.112.112",
                      "208.67.222.222",
                      "208.67.220.220",
                      "8.26.56.26",
                      "8.20.247.20"
                  ]
              },
              "proxies": [],
              "proxy-groups": [
                  {
                      "name": "PROXY",
                      "type": "select",
                      "proxies": []
                  }
              ],
              "rules": ["MATCH,PROXY"]
          }

          def fix_base64_key(key):
              key = key.strip()
              padding = 4 - len(key) % 4
              if padding != 4:
                  key += '=' * padding
              try:
                  decoded = base64.b64decode(key)
                  return base64.b64encode(decoded).decode('ascii')
              except:
                  return key

          def parse_wireguard_config(line):
              decoded = unquote(line)
              match = re.match(r'wireguard://([^@]+)@([^:]+):(\d+)\?(.+?)(?:#(.+))?$', decoded)
              if not match:
                  return None
              
              private_key = fix_base64_key(match.group(1))
              address = match.group(2)
              port = int(match.group(3))
              params = match.group(4)
              
              params_dict = {}
              for param in params.split('&'):
                  if '=' in param:
                      key, value = param.split('=', 1)
                      params_dict[key] = value
              
              public_key = fix_base64_key(params_dict.get('publickey', ''))
              preshared_key = fix_base64_key(params_dict.get('presharedkey', ''))
              
              addresses_raw = params_dict.get('address', '')
              addresses = [addr.strip() for addr in addresses_raw.split(',') if addr.strip()]
              
              reserved_raw = params_dict.get('reserved', '0,0,0')
              reserved = [int(r.strip()) for r in reserved_raw.split(',') if r.strip()]
              
              return {
                  'private_key': private_key,
                  'address': address,
                  'port': port,
                  'public_key': public_key,
                  'preshared_key': preshared_key,
                  'addresses': addresses,
                  'reserved': reserved,
                  'endpoint': f"{address}:{port}"
              }

          def generate_proxy_name(endpoint, index):
              safe_name = re.sub(r'[^a-zA-Z0-9\-]', '-', endpoint)
              return f"WG-{safe_name}-{index}"

          def generate_conf_content(config):
              conf = f"""[Interface]
          PrivateKey = {config['private_key']}
          Address = {', '.join(config['addresses'])}
          DNS = 1.1.1.1, 1.0.0.1, 8.8.8.8, 8.8.4.4, 9.9.9.9, 149.112.112.112, 208.67.222.222, 208.67.220.220, 8.26.56.26, 8.20.247.20
          MTU = 1280
          Jc = 5
          Jmin = 24
          Jmax = 100
          S1 = 0
          S2 = 0
          S3 = 14
          I1 = 0
          H1 = 1
          H2 = 2
          H3 = 3
          H4 = 4
          [Peer]
          PublicKey = {config['public_key']}
          AllowedIPs = 0.0.0.0/0, ::/0
          Endpoint = {config['endpoint']}
          PersistentKeepalive = 10
          """
              if config['preshared_key']:
                  conf = conf.replace('[Peer]\n', f'[Peer]\nPresharedKey = {config["preshared_key"]}\n')
              return conf.strip() + '\n'

          def write_yaml(config, filepath):
              class CustomDumper(yaml.Dumper):
                  def increase_indent(self, flow=False, indentless=False):
                      return super(CustomDumper, self).increase_indent(flow, False)
              
              with open(filepath, 'w', encoding='utf-8') as f:
                  yaml.dump(config, f, Dumper=CustomDumper, 
                            default_flow_style=False, 
                            allow_unicode=True, 
                            sort_keys=False,
                            indent=2)

          if not os.path.exists(INPUT_FILE):
              print(f"File {INPUT_FILE} not found!")
              exit(1)

          seen_endpoints = set()
          parsed_configs = []
          
          with open(INPUT_FILE, 'r', encoding='utf-8') as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith("wireguard://"):
                      continue
                  match = re.search(r'@([^?#]+)', line)
                  if not match:
                      continue
                  endpoint = match.group(1)
                  if endpoint not in seen_endpoints:
                      seen_endpoints.add(endpoint)
                      config = parse_wireguard_config(line)
                      if config:
                          parsed_configs.append(config)
          
          if parsed_configs:
              random.shuffle(parsed_configs)
              with open(INPUT_FILE, 'w', encoding='utf-8') as f:
                  for config in parsed_configs:
                      encoded_private = quote(config['private_key'], safe='')
                      encoded_public = quote(config['public_key'], safe='')
                      f.write(f"wireguard://{encoded_private}@{config['endpoint']}?publickey={encoded_public}&address={','.join(config['addresses'])}&mtu=1280\n")
              print(f"{INPUT_FILE}: {len(parsed_configs)} unique configs written (random order)")
          
          proxies = []
          proxy_names = []
          
          with tempfile.TemporaryDirectory() as tmpdir:
              for idx, config in enumerate(parsed_configs, 1):
                  conf_name = f"@DeltaKroneckerGithub ({idx}).conf"
                  conf_path = os.path.join(tmpdir, conf_name)
                  with open(conf_path, 'w', encoding='utf-8') as f:
                      f.write(generate_conf_content(config))
                  
                  proxy_name = generate_proxy_name(config['endpoint'], idx)
                  proxy_names.append(proxy_name)
                  
                  proxy = {
                      'name': proxy_name,
                      'type': 'wireguard',
                      'server': config['address'],
                      'port': config['port'],
                      'private-key': config['private_key'],
                      'public-key': config['public_key'],
                      'mtu': 1280,
                      'udp': True,
                      'reserved': config['reserved'],
                      'workers': 4,
                      'persistent-keepalive': 10,
                      'jc': 5,
                      'jmin': 24,
                      'jmax': 100,
                      's1': 0,
                      's2': 0,
                      's3': 14,
                      'i1': 0,
                      'h1': 1,
                      'h2': 2,
                      'h3': 3,
                      'h4': 4
                  }
                  
                  if config['addresses']:
                      for addr in config['addresses']:
                          addr_clean = addr.strip().split('/')[0] if '/' in addr else addr.strip()
                          if ':' in addr_clean:
                              proxy['ipv6'] = addr_clean
                          else:
                              proxy['ip'] = addr_clean
                  
                  proxies.append(proxy)
              
              if os.path.exists(ZIP_FILE):
                  os.remove(ZIP_FILE)
              
              with zipfile.ZipFile(ZIP_FILE, 'w', zipfile.ZIP_DEFLATED) as zipf:
                  for i in range(1, len(parsed_configs) + 1):
                      conf_file = f"@DeltaKroneckerGithub ({i}).conf"
                      conf_path = os.path.join(tmpdir, conf_file)
                      if os.path.exists(conf_path):
                          zipf.write(conf_path, conf_file)
          
          output_config = BASE_CONFIG.copy()
          output_config['proxies'] = proxies
          
          # Assign all proxy names directly to PROXY group
          for group in output_config['proxy-groups']:
              if group['name'] == 'PROXY':
                  group['proxies'] = proxy_names.copy()
          
          write_yaml(output_config, OUTPUT_FILE)
          print(f"Generated {OUTPUT_FILE} with {len(proxies)} AmneziaWG proxies (random order)")
          print(f"Generated {ZIP_FILE} with {len(parsed_configs)} WireGuard config files")

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Generate AmneziaWG Clash config with individual selectable proxies"
          git push
